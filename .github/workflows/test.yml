name: 软件测试

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: 安装测试依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 执行软件测试
        run: python -m pytest -q
